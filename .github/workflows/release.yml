name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, e.g. 0.1.1
        required: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-slim
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - run: '[[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Version must look like 1.2.3"; exit 1; }'
      - run: '[[ "$GITHUB_REF" == refs/heads/main ]] || { echo "Releases are made from main"; exit 1; }'

  release:
    needs: check
    runs-on: xcode-27
    permissions:
      contents: write
    env:
      VERSION: ${{ inputs.version }}
      RELEASES_URL: ${{ github.server_url }}/${{ github.repository }}/releases
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Set the version
        run: |
          plutil -replace CFBundleShortVersionString -string "$VERSION" Support/Info.plist
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -am "chore: Release v${VERSION}"

      - name: Build
        run: |
          swift build -c release --arch arm64
          bin=$(swift build -c release --arch arm64 --show-bin-path)
          helper=dev.whyredfire.blowmyfans.helper
          app="build/Blow My Fans.app"

          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources" "$app/Contents/Library/LaunchServices" "$app/Contents/Frameworks"
          cp Support/Info.plist "$app/Contents/"
          plutil -replace CFBundleVersion -string "$(git rev-list --count HEAD)" "$app/Contents/Info.plist"
          cp "$bin/BlowMyFans" "$app/Contents/MacOS/"
          cp "$bin/BlowMyFansHelper" "$app/Contents/Library/LaunchServices/$helper"
          cp "Support/$helper.plist" Support/helper-tool.sh Support/AppIcon.icns "$app/Contents/Resources/"
          cp -R Support/Database Support/Localization/*.lproj "$app/Contents/Resources/"
          ditto .build/artifacts/sparkle/Sparkle/Sparkle.xcframework/macos-arm64_x86_64/Sparkle.framework \
            "$app/Contents/Frameworks/Sparkle.framework"

          # Ad-hoc signed inside-out: Sparkle's nested executables, the framework, the helper, then the app
          framework="$app/Contents/Frameworks/Sparkle.framework/Versions/B"
          for item in XPCServices/Installer.xpc XPCServices/Downloader.xpc Autoupdate Updater.app; do
            codesign --force --options runtime --sign - "$framework/$item"
          done
          codesign --force --options runtime --sign - "$app/Contents/Frameworks/Sparkle.framework"
          codesign --force --options runtime --sign - --identifier "$helper" "$app/Contents/Library/LaunchServices/$helper"
          codesign --force --options runtime --sign - --entitlements Support/BlowMyFans.entitlements "$app"
          codesign --verify --deep --strict "$app"

      # Shown in the app's update window: features and fixes to the app since the previous release,
      # without commit types or hashes. Website and tooling changes are left out.
      - name: Write the update notes
        run: |
          mkdir dist
          previous=$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || true)
          commits() {
            git log --no-merges --pretty=%s "${previous:+$previous..}HEAD~1" -- Sources Support \
              | sed -nE "s/^$1(\([^)]*\))?!?: (.*)/- \2/p"
          }
          new=$(commits feat)
          fixed=$(commits fix)
          {
            if [ -n "$new" ]; then printf '## New\n\n%s\n\n' "$new"; fi
            if [ -n "$fixed" ]; then printf '## Fixed\n\n%s\n\n' "$fixed"; fi
            if [ -z "$new$fixed" ]; then printf 'Small improvements behind the scenes.\n'; fi
          } > dist/BlowMyFans.md
          cat dist/BlowMyFans.md

      # Installed copies only accept updates signed with the key behind SUPublicEDKey
      - name: Generate the appcast
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          ditto -c -k --sequesterRsrc --keepParent "build/Blow My Fans.app" dist/BlowMyFans.zip
          echo "$SPARKLE_PRIVATE_KEY" | .build/artifacts/sparkle/Sparkle/bin/generate_appcast \
            --ed-key-file - \
            --download-url-prefix "${RELEASES_URL}/download/v${VERSION}/" \
            --full-release-notes-url "$RELEASES_URL" \
            --embed-release-notes \
            dist

      # This repo is also a Homebrew tap; the cask's new version and checksum join the release commit
      - name: Update the Homebrew cask
        run: |
          checksum=$(shasum -a 256 dist/BlowMyFans.zip | cut -d ' ' -f 1)
          sed -i '' -e "s/^  version .*/  version \"${VERSION}\"/" -e "s/^  sha256 .*/  sha256 \"${checksum}\"/" Casks/blow-my-fans.rb
          git commit --amend --no-edit -- Casks/blow-my-fans.rb

      # Notes list the commits since the previous release; GitHub adds the compare link
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          previous=$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || true)
          git tag "v${VERSION}"
          git push --atomic origin HEAD "v${VERSION}"
          gh release create "v${VERSION}" dist/BlowMyFans.zip dist/appcast.xml \
            --title "Blow My Fans ${VERSION}" \
            --notes "$(git log --no-merges --pretty='- %s (%h)' "${previous:+$previous..}HEAD~1")" \
            --generate-notes
