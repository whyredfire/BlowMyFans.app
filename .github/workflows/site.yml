name: site

on:
  push:
    branches:
      - main
    paths:
      - site/**
      - .github/workflows/site.yml
  pull_request:
    paths:
      - site/**
      - .github/workflows/site.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-slim
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run build
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site/dist

  # Pull requests only check that the site builds
  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-slim
    permissions:
      pages: write
      id-token: write
    concurrency: pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
